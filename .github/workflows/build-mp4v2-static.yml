name: Build mp4v2 Static Single Binary (Ubuntu24.04)

on:
  workflow_dispatch: # 仅网页手动触发（不再随 push 自动构建）
    inputs:
      tag:
        description: 'Release 标签/版本号，例如 v1.0.0'
        required: true
        default: 'v1.0.0'
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # 允许创建 GitHub Release
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential autoconf automake libtool pkg-config

      - name: Autotools build static libmp4v2
        run: |
          autoreconf -fiv
          # --enable-static 编译静态库；--disable-shared 不生成so
          ./configure --prefix="$PWD/out" --enable-static --disable-shared
          make -j$(nproc)
          make install

      - name: Test static binary
        run: |
          ./out/bin/mp4info --version

      - name: Upload single binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: mp4v2-static-ubuntu2404-amd64
          path: out/bin/
          retention-days: 90

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          # 打包全部静态二进制，文件名带上版本号标签
          tar -czf "mp4v2-static-ubuntu2404-amd64_${TAG}.tar.gz" -C out bin
          # 标签已存在 Release（重复运行）时 gh release create 会报错，
          # 此时回退为只上传/覆盖二进制包。
          # 发行说明取自仓库根目录的 RELEASE_NOTES.md（请与源码一起提交）。
          if ! gh release create "$TAG" "mp4v2-static-ubuntu2404-amd64_${TAG}.tar.gz" \
              --title "mp4v2 static binaries $TAG" \
              --notes-file RELEASE_NOTES.md; then
            gh release upload "$TAG" "mp4v2-static-ubuntu2404-amd64_${TAG}.tar.gz" --clobber
          fi
