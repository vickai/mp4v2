name: Build mp4v2 Static Single Binary (Ubuntu24.04)
on:
  push:
  workflow_dispatch: # 网页手动触发

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # 允许创建 GitHub Release
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential autoconf automake libtool pkg-config

      - name: Autotools build static libmp4v2
        run: |
          autoreconf -fiv
          # --enable-static 编译静态库；--disable-shared 不生成so
          ./configure --prefix="$PWD/out" --enable-static --disable-shared
          make -j$(nproc)
          make install

      - name: Test static binary
        run: |
          ./out/bin/mp4info --version

      - name: Upload single binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: mp4v2-static-ubuntu2404-amd64
          path: out/bin/
          retention-days: 90

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/') # 只在推送标签时创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 打包全部静态二进制（tar 是运行器自带工具，无需额外安装）
          tar -czf mp4v2-static-ubuntu2404-amd64.tar.gz -C out bin
          # 标签已有 Release（网页手动发布过）时 gh release create 会报错，
          # 此时回退为只上传/覆盖二进制包
          if ! gh release create "${{ github.ref_name }}" mp4v2-static-ubuntu2404-amd64.tar.gz \
              --title "mp4v2 static binaries ${{ github.ref_name }}" \
              --notes "Ubuntu 24.04 amd64 静态单文件二进制：mp4art, mp4chaps, mp4extract, mp4file, mp4info, mp4subtitle, mp4tags, mp4track, mp4trackdump, mp4freetag"; then
            gh release upload "${{ github.ref_name }}" mp4v2-static-ubuntu2404-amd64.tar.gz --clobber
          fi
